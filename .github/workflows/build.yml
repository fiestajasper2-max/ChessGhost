name: Build ChessGhost APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.2 --distribution-type bin

      - name: Download Stockfish ARM64 binary
        run: |
          mkdir -p app/src/main/assets
          curl -L \
            "https://github.com/official-stockfish/Stockfish/releases/download/sf_16.1/stockfish-android-armv8.tar" \
            -o sf.tar
          tar -xf sf.tar
          find . -name "stockfish*" -not -name "*.tar" -type f \
            | head -1 \
            | xargs -I{} cp {} app/src/main/assets/stockfish
          chmod +x app/src/main/assets/stockfish
          echo "--- verify binary ---"
          ls -lh app/src/main/assets/stockfish
          file app/src/main/assets/stockfish

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename and collect APK
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -1)
          echo "Found APK: $APK"
          cp "$APK" dist/Chess-bot.apk
          ls -lh dist/Chess-bot.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chess-bot
          path: dist/Chess-bot.apk