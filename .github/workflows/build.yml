name: Build ChessGhost APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Stockfish ARM64 binary
        run: |
          mkdir -p app/src/main/assets
          curl -L "https://github.com/official-stockfish/Stockfish/releases/download/sf_16/stockfish-android-armv8.zip" -o sf.zip
          unzip sf.zip
          find . -name "stockfish*" -type f ! -name "*.zip" | head -1 | xargs -I{} mv {} app/src/main/assets/stockfish
          chmod +x app/src/main/assets/stockfish

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate gradlew if missing
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.2
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessGhost-debug
          path: app/build/outputs/apk/debug/app-debug.apk