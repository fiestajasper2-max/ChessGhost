name: Build ChessGhost APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download Stockfish ARM64 binary
        run: |
          mkdir -p app/src/main/assets
          curl -L \
            "https://github.com/official-stockfish/Stockfish/releases/download/sf_16.1/stockfish-android-armv8.tar" \
            -o sf.tar
          tar -xf sf.tar
          find . -name "stockfish_*armv8*" -o -name "stockfish-android-armv8" \
            | grep -v ".tar" | head -1 \
            | xargs -I{} cp {} app/src/main/assets/stockfish
          chmod +x app/src/main/assets/stockfish
          echo "--- binary check ---"
          ls -lh app/src/main/assets/stockfish
          file app/src/main/assets/stockfish

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessGhost-debug
          path: app/build/outputs/apk/debug/Chess-ghost.apk