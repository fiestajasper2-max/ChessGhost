// app/build.gradle — add abiFilters + jniLibs source set + disable .so compression
plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.chessghost.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.chessghost.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        base.archivesName = "Chess-bot"

        // Only package the ABI your stockfish binary is built for
        // Change to "armeabi-v7a" or add "x86_64" if you have those builds
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    // Tell Gradle where jniLibs live (default path, explicit is safer)
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    // Do NOT compress .so files — required for direct execution from nativeLibraryDir
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.compose.ui:ui:1.6.1'
    implementation 'androidx.compose.ui:ui-graphics:1.6.1'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.6.1'
    implementation 'androidx.compose.material3:material3:1.2.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.6.1'
}